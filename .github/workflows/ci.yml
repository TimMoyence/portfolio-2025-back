name: Back CI/CD

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio_2025_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portfolio_2025_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version resolue depuis le champ `packageManager` de package.json.
      # Ne pas repasser `version:` ici : action-setup echoue si les deux
      # sources divergent, et le champ package.json fait foi (meme version
      # que le Dockerfile et que les postes de dev via corepack).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests des gardes d outillage
        run: pnpm run test:guards

      # Cliquet non-regressif sur les commentaires narratifs : le plafond vit
      # dans `"guard-no-comments".maxOffenses` (package.json), a cote du
      # `coverageThreshold` tenu par jest-ratchet. Le gate echoue si le compte
      # depasse le plafond, et imprime la valeur a poser quand il passe dessous.
      - name: Garde no-comment (cliquet)
        run: pnpm run guard:comments

      - name: Run coverage gate
        run: pnpm run test:cov:ci

      - name: Run DB integration tests (legacy repositories)
        env:
          RUN_DB_INTEGRATION: 'true'
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_NAME: portfolio_2025_ci
        run: pnpm run test:integration:db

      - name: Run e2e transportless tests
        run: pnpm run test:e2e

      - name: Run e2e HTTP socket tests
        run: pnpm run test:e2e:http

      - name: Build API
        run: pnpm run build

  security:
    name: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cliquet anti-regression sur les dependances de PRODUCTION.
      # `dependency-review` ci-dessus ne tourne que sur pull_request : sans ce
      # step, un push direct sur master n'est couvert par aucun controle de
      # vulnerabilites (finding BSEC1 de l'audit converge 2026-06-08).
      #
      # Seuil `critical` et non `high` : l'arbre de production compte
      # aujourd'hui 27 vulnerabilites high (0 critical, mesure du 2026-08-05).
      # Bloquer sur `high` casserait la CI immediatement. Le seuil est donc
      # place la ou il tient, et la resorption des `high` est suivie a part.
      # `--prod` exclut les devDependencies, non exploitables au runtime.
      - name: Audit des dependances de production
        run: pnpm audit --prod --audit-level critical

  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs:
      - quality-gate
      - security
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/timmoyence/portfolio-2025-back:${{ github.sha }}
            ghcr.io/timmoyence/portfolio-2025-back:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: docker
    steps:
      - name: Check required secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_REGISTRY_USER: ${{ secrets.DEPLOY_REGISTRY_USER }}
          DEPLOY_REGISTRY_TOKEN: ${{ secrets.DEPLOY_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for v in DEPLOY_HOST DEPLOY_USER SSH_PRIVATE_KEY DEPLOY_REGISTRY_USER DEPLOY_REGISTRY_TOKEN; do
            if [ -z "${!v:-}" ]; then
              echo "Missing secret: $v"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "Required secrets missing. Skipping deploy."
            exit 1
          fi
      - name: Deploy API container
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_COMPOSE_FILE: ${{ secrets.DEPLOY_COMPOSE_FILE }}
          PROJECT: 'portfolio25'
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            WORKDIR="${DEPLOY_PATH:-/opt/portfolio-2025}"
            COMPOSE_FILE="${DEPLOY_COMPOSE_FILE:-$WORKDIR/compose.yaml}"
            BACK_IMAGE_VALUE="ghcr.io/${{ secrets.DEPLOY_REGISTRY_USER }}/portfolio-2025-back:${{ github.sha }}"
            FRONT_IMAGE_VALUE="ghcr.io/${{ secrets.DEPLOY_REGISTRY_USER }}/portfolio-2025-front:latest"

            PROJECT="portfolio25"

            cd "$WORKDIR"
            echo "${{ secrets.DEPLOY_REGISTRY_TOKEN }}" | docker login ghcr.io -u "${{ secrets.DEPLOY_REGISTRY_USER }}" --password-stdin || true
            BACK_IMAGE="$BACK_IMAGE_VALUE" FRONT_IMAGE="$FRONT_IMAGE_VALUE" \
            docker compose -p "$PROJECT" -f "$COMPOSE_FILE" --env-file "$WORKDIR/backend.env" pull api migrate

            # Run migrations on THE SAME project/network/db
            BACK_IMAGE="$BACK_IMAGE_VALUE" FRONT_IMAGE="$FRONT_IMAGE_VALUE" \
            docker compose -p "$PROJECT" -f "$COMPOSE_FILE" --env-file "$WORKDIR/backend.env" run --rm migrate

            BACK_IMAGE="$BACK_IMAGE_VALUE" FRONT_IMAGE="$FRONT_IMAGE_VALUE" \
            docker compose -p "$PROJECT" -f "$COMPOSE_FILE" --env-file "$WORKDIR/backend.env" up -d --no-deps --wait --wait-timeout 90 api
